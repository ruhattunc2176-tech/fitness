<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#FAF6EA">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800;900&display=swap">
<style>
/* Tarz: hafifletilmiş neo-brutalist — krem zemin, 2px siyah çizgi, küçük sert gölge; sarı yalnızca vurguda */
:root{
  --bg:#FAF6EA; --sari:#FFE14D; --card:#FFFFFF; --ink:#000000; --muted:#4A4A4A; --line:#000000; --soft:#FFF6CF;
  --ac:#FF5A36; --ac-ink:#000000; --ac-s:#FFD3C7; --ok:#2BD46B; --ok-ink:#000000; --ok-s:#C8F5D8; --ok-yazi:#0B7A35; --warn:#B45309; --kir:#D21F1F;
  --sh:3px 3px 0 #000; --sh-k:2px 2px 0 #000; --r:10px;
  --f:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;font-weight:500;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(116px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:34px;font-weight:900;line-height:1;letter-spacing:-.01em;text-transform:uppercase}
h2{margin:0;font-size:20px;font-weight:900;text-transform:uppercase}
.lb{font-size:14px;color:var(--muted);font-weight:600}
.k{background:var(--card);border-radius:var(--r);border:2px solid var(--line);box-shadow:var(--sh)}
.pad{padding:14px;display:flex;flex-direction:column;gap:12px}
.ust{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{border:2px solid #000;border-radius:var(--r);background:var(--ac);color:#000;font-weight:800;font-size:18px;letter-spacing:.03em;text-transform:uppercase;padding:14px;width:100%;box-shadow:3px 3px 0 #000;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 #000}
.btn:disabled{opacity:.45}
.btn.ikincil{background:#fff;font-size:15px;padding:10px}
.btn.kucuk{width:auto;font-size:15px;padding:10px 16px}
.btn.yesil{background:var(--ok)}
.btn.kir{background:#fff;color:var(--kir);font-size:15px;padding:10px}
.ikb{width:46px;height:46px;border-radius:var(--r);border:2px solid #000;background:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--sh-k)}
.ikb:active{transform:translate(2px,2px);box-shadow:none}
.ikb svg{width:22px;height:22px}
.geri{border:0;background:none;color:#000;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.03em;padding:4px 0;align-self:flex-start;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.cipler{display:flex;gap:8px;overflow-x:auto;padding:0 4px 4px 0}
.cip{flex:none;border:2px solid #000;background:#fff;border-radius:8px;padding:7px 14px;font-weight:700;font-size:15px;color:#000}
.cip.on{background:#000;color:var(--sari)}
.iki{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.st{padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;border:2px solid #000;background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.st:active{transform:translate(3px,3px);box-shadow:none}
.st b{font-size:28px;font-weight:900;line-height:1.1}
.st .iyi{color:var(--ok-yazi);font-weight:800;font-size:14px}
.st .dikkat{color:var(--warn);font-weight:800;font-size:14px}
.sat{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-top:1.5px solid #000;background:none;width:100%;text-align:left}
.sat:first-child{border-top:0}
.k.sat{border:2px solid #000;background:var(--card)}
.k.sat:active{transform:translate(3px,3px);box-shadow:none}
.sat img{width:48px;height:48px;border-radius:8px;border:2px solid #000;object-fit:cover;flex:none;background:var(--soft);display:block}
.buyut{position:relative;flex:none;display:block;cursor:zoom-in}
.buyut i{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:5px;background:var(--sari);border:2px solid #000;color:#000;font-style:normal;font-size:11px;font-weight:900;display:grid;place-items:center;line-height:1}
.sat .a{flex:1;min-width:0}
.sat .a b{display:block;font-size:17px;font-weight:800;line-height:1.2}
.sat .a span{font-size:14px;color:var(--muted);font-weight:600}
.sat .v{font-size:16px;font-weight:800;color:#000;white-space:nowrap}
.sat .ok{width:28px;height:28px;border-radius:6px;background:var(--ok);border:2px solid #000;color:#000;display:grid;place-items:center;font-size:15px;font-weight:900;flex:none}
.sat .bos{width:28px;height:28px;border-radius:6px;border:2px solid #000;background:#fff;flex:none}
/* antrenman kartı */
.hk{padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:4px 4px 0 var(--ac)}
.hb{display:flex;gap:12px;align-items:center}
.hb>div{flex:1;min-width:0}
.kk{flex:none;align-self:flex-start;width:40px;height:40px;border-radius:8px;border:2px solid #000;background:var(--sari);color:#000;display:grid;place-items:center;padding:0}
.kk:active{transform:scale(.94)}
.kk svg{width:20px;height:20px}
.hb .foto{width:72px;height:72px;border-radius:var(--r);overflow:hidden;flex:none;border:2px solid #000;padding:0;background:var(--soft)}
.hb .foto img{width:100%;height:100%;object-fit:cover;display:block}
.hb b{display:block;font-size:22px;font-weight:900;line-height:1.1}
.hb .bil{font-size:14px;color:var(--muted);font-weight:600}
.link{border:0;background:none;padding:0;color:#000;font-weight:800;font-size:15px;text-decoration:underline;text-decoration-color:var(--ac);text-decoration-thickness:3px;text-underline-offset:3px}
.gec{font-size:15px;color:var(--muted);font-weight:600}
.oner{font-size:15px;font-weight:700;background:var(--ac-s);color:#000;border:2px solid #000;border-radius:8px;padding:8px 11px}
.yset{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;padding:8px 11px;border-radius:8px;border:2px solid #000;background:var(--ok-s);color:#000}
.yset i{width:22px;height:22px;border-radius:5px;background:var(--ok);border:2px solid #000;color:#000;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:900;flex:none}
.yset button{margin-left:auto;border:0;background:none;color:inherit;font-weight:700;font-size:14px;padding:0;text-decoration:underline}
.akt{background:var(--soft);border:2px solid #000;border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:12px}
.akt .t{align-self:flex-start;font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;background:#000;color:var(--sari);border-radius:6px;padding:3px 9px}
.ad{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ad .ad-l{font-size:16px;font-weight:800}
.ad .ad-l small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.ad .r{display:flex;align-items:center;gap:6px}
.ad button{width:50px;height:50px;border-radius:8px;border:2px solid #000;background:#fff;font-size:26px;font-weight:800;display:grid;place-items:center;box-shadow:var(--sh-k);transition:transform .06s,box-shadow .06s}
.ad button:active{transform:translate(2px,2px);box-shadow:none}
.ad input{width:88px;text-align:center;font-size:38px;font-weight:900;border:0;background:none;padding:0;font-variant-numeric:tabular-nums;line-height:1}
.ad input:focus{outline:2px solid var(--ac);border-radius:8px}
.sure{font-size:16px;color:#000;font-weight:800;font-variant-numeric:tabular-nums}
/* dinlenme */
.din{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(18px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none}
.din>div{pointer-events:auto;width:100%;max-width:496px;background:#000;color:#fff;border:2px solid #000;border-radius:var(--r);padding:11px 13px;display:flex;align-items:center;gap:12px;box-shadow:3px 3px 0 var(--ac)}
.din b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;min-width:62px;color:var(--sari)}
.din .bar{flex:1;height:10px;border-radius:3px;background:#3A3A3A;overflow:hidden}
.din .bar i{display:block;height:100%;background:var(--sari)}
.din button{border:0;background:#fff;color:#000;font-weight:800;font-size:14px;padding:8px 11px;border-radius:6px}
/* alt menü */
.tab{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:2px solid #000;display:flex;justify-content:center;gap:6px;padding:8px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
.tab button{flex:1;max-width:160px;border:2px solid transparent;border-radius:8px;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:#000;padding:5px 0}
.tab button.on{background:var(--sari);border-color:#000;box-shadow:var(--sh-k)}
.tab svg{width:24px;height:24px}
/* büyük fotoğraf */
.perde{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.perde>div{width:100%;max-width:520px;background:var(--card);border:2px solid #000;border-radius:12px;box-shadow:3px 3px 0 var(--ac);padding:14px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.fotolar figure{position:relative;cursor:zoom-in}
.fotolar figure i{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:6px;background:var(--sari);border:2px solid #000;color:#000;font-style:normal;font-size:13px;font-weight:900;display:grid;place-items:center;line-height:1}
.tam{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tam .tust{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tam .tust b{font-size:20px;font-weight:900;line-height:1.15}
.tam .tres{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.tam .tres img{width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#111}
.tam .talt{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tam .talt span{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;text-align:center}
.tam .tac{font-size:17px;font-weight:600;line-height:1.4;background:#fff;color:#000;border-radius:8px;padding:10px 12px}
.tam .ikb{color:#000;font-size:22px;font-weight:900;box-shadow:2px 2px 0 var(--ac)}
.tam .btn{box-shadow:3px 3px 0 #fff}
.perde h2{text-transform:none;font-size:22px}
.fotolar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fotolar figure{margin:0;display:flex;flex-direction:column;gap:4px}
.fotolar img{width:100%;aspect-ratio:3/2;object-fit:contain;border:2px solid #000;border-radius:8px;background:var(--soft)}
.fotolar figcaption{font-size:13px;color:#000;font-weight:800;text-align:center;text-transform:uppercase}
/* formlar */
.alan{width:100%;min-width:0;background:#fff;border:2px solid #000;border-radius:8px;padding:11px;font-size:16px;font-weight:600}
.alan:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.duz{display:grid;grid-template-columns:44px minmax(0,1fr) 46px 64px 36px;gap:8px;align-items:center;padding:9px 0;border-top:1.5px solid #000}
.duz img{width:44px;height:44px;border-radius:8px;border:2px solid #000;object-fit:cover;display:block}
.duz b{font-size:15px;font-weight:800;line-height:1.2}
.duz .alan{padding:7px 4px;font-size:15px;font-weight:700;text-align:center}
.sil{height:36px;width:36px;border:2px solid #000;border-radius:8px;background:#fff;color:#000;display:grid;place-items:center;padding:0}
.sil:active{background:var(--ac)}
.sil svg{width:18px;height:18px}
.prg{display:flex;align-items:center;gap:12px}
.prg>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prg small{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.prg b{font-size:21px;font-weight:900;line-height:1.15}
.prg span{font-size:14px;color:var(--muted);font-weight:600}
.prg .btn{width:auto;flex:none;padding:10px 14px}
.hp{padding:14px;display:flex;flex-direction:column;gap:9px}
.hp.on{box-shadow:4px 4px 0 var(--ac)}
.hp .u{display:flex;align-items:center;gap:10px}
.hp .no{flex:none;width:30px;height:30px;border-radius:6px;background:#000;color:var(--sari);display:grid;place-items:center;font-weight:900;font-size:15px}
.hp.on .no{background:var(--ac);color:#000;border:2px solid #000}
.hp .u b{flex:1;min-width:0;font-size:19px;font-weight:900;line-height:1.15}
.hp .et{flex:none;font-size:12px;font-weight:900;text-transform:uppercase;color:#000;background:var(--sari);border:2px solid #000;border-radius:6px;padding:2px 8px}
.hp .hd{font-size:15px;font-weight:600}
.hp .c{display:flex;flex-wrap:wrap;gap:6px}
.hp .c span{font-size:13px;font-weight:700;background:var(--soft);color:#000;border:2px solid #000;border-radius:6px;padding:2px 8px}
.hgor{align-self:flex-start;border:0;background:none;padding:6px 0;font-weight:800;font-size:15px;color:#000;display:flex;align-items:center;gap:6px}
.hgor i{font-style:normal;display:inline-block;transition:transform .15s}
.hgor.on i{transform:rotate(90deg)}
.gs{display:flex;gap:6px}
.gs button{flex:1 1 auto;min-width:0;border:2px solid #000;background:#fff;border-radius:8px;padding:7px 5px;font-weight:800;font-size:13.5px;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs button.on{background:#000;color:var(--sari)}
.hl{border:2px solid #000;border-radius:8px;overflow:hidden}
.hs{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1.5px solid #000}
.hs:first-child{border-top:0}
.hs .sn{width:18px;font-size:13px;font-weight:900;color:var(--muted);flex:none;text-align:center}
.hs img{width:42px;height:42px;border-radius:8px;border:2px solid #000;object-fit:cover;display:block;background:var(--soft)}
.hs b{flex:1;min-width:0;font-size:15px;font-weight:800;line-height:1.2}
.hs .rz{flex:none;font-size:13px;font-weight:900;background:var(--sari);border:2px solid #000;border-radius:6px;padding:2px 7px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hoz{font-size:13px;font-weight:700;color:var(--muted)}
.hp .btn{font-size:15px;padding:11px}
.bilgi{display:flex;flex-direction:column;gap:9px}
.bilgi div{font-size:15px;font-weight:600;line-height:1.35}
.bilgi b{display:inline-block;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;background:#000;color:var(--sari);border:2px solid #000;border-radius:6px;padding:1px 8px;margin-bottom:3px}
.bilgi .iyi b{background:var(--ok);color:#000}
.bilgi .kotu b{background:var(--ac);color:#000}
.halka{position:relative;width:216px;height:216px;margin:2px auto}
.halka svg{width:100%;height:100%;transform:rotate(-90deg)}
.halka .orta{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.halka small{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.halka b{font-size:46px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.hedef{display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:800}
.hedef button{width:34px;height:34px;border:2px solid #000;border-radius:8px;background:#fff;font-size:20px;font-weight:900;display:grid;place-items:center;padding:0}
.sat:has(.fk){flex-wrap:wrap}
.fk{flex-basis:100%;display:flex;flex-direction:column;gap:6px}
.cb{display:block;height:20px;border:2px solid #000;border-radius:6px;background:#fff;position:relative;overflow:hidden}
.cb i{position:absolute;top:0;bottom:0;background:var(--ac);border-left:2px solid #000;border-right:2px solid #000}
.fk .al{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:700;align-items:center}
.fk .al em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.fk .al em::before{content:"";width:12px;height:12px;border:2px solid #000;border-radius:3px;background:var(--c)}
.fk .f{font-size:13px;font-weight:800;background:var(--sari);border:2px solid #000;border-radius:6px;padding:1px 7px}
.hedef input{width:64px;text-align:center;font-size:20px;font-weight:900;border:2px solid #000;border-radius:8px;background:#fff;padding:4px 2px;font-variant-numeric:tabular-nums}
.hedef input:focus{outline:3px solid var(--ac);outline-offset:1px}
.hedef button:active{background:var(--sari)}
.oz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.oz div{background:var(--soft);border:2px solid #000;border-radius:8px;padding:9px 4px}
.oz b{display:block;font-size:19px;font-weight:900;line-height:1.15}
.oz span{font-size:12.5px;font-weight:700;color:var(--muted)}
.zaman{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zaman label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:900;text-transform:uppercase}
.grafik{width:100%;height:auto;display:block}
.satir2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:16px;font-weight:600;padding:8px 0;border-top:1.5px solid #000}
.satir2:first-of-type{border-top:0}
.satir2 .art{color:var(--ok-yazi);font-weight:800}
.sg{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.uyd{display:flex;gap:14px;align-items:baseline;flex:none}
.uyd .link{font-size:14px}
.lnk{background:var(--soft);border:2px solid #000;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.lnk small{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.lnk b{font-size:14px;font-weight:700;word-break:break-all;user-select:all}
.al{position:relative}
.al .alan{padding-right:50px}
.goz{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;display:grid;place-items:center;color:#000;padding:0}
.goz svg{width:22px;height:22px}
.guc{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.guc i{height:9px;border:2px solid #000;border-radius:4px;background:#fff}
.gy{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-top:-10px;min-height:1.3em}
.kr{background:#fff;border:2px solid #000;border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:6px}
.kr div{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted)}
.kr b{width:20px;height:20px;border:2px solid #000;border-radius:5px;display:grid;place-items:center;font-size:12px;font-weight:900;background:#fff;color:transparent;flex:none}
.kr .ok{color:#000}
.kr .ok b{background:var(--ok);color:#000}
.hata{font-size:14px;color:var(--kir);font-weight:700;min-height:1.2em}

@keyframes kaySol{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
@keyframes kaySag{from{transform:translateX(-28px);opacity:.4}to{transform:none;opacity:1}}

    if(a==="wuTik"){const i=+b.dataset.i;if(W.t[i])delete W.t[i];else{W.t[i]=1;if(!gunSeansi(d.id)){seansAc(d.id);kaydet(["main"])}}   /* ısınma antrenmana dahil: süre ilk ısınma işaretinde başlar */
      if(isinmaListe(d).every((x,j)=>W.t[j])){W.kapali=true;tost("Isınma tamam")}}
    else if(a==="wuKapat")W.kapali=true;else if(a==="wuAc")W.kapali=false;
    else W.sg=!(W.sg==null?(d.ex.length>0&&d.ex.every(e=>tamamMi(gunSeansi(d.id),e))):W.sg);

  const x=V.v==="ant"&&acikEx();

      if(s.sets[e.id].length<e.sets||d.ex.some(q=>!tamamMi(s,q)))dinlen(e.rest);else{D=null;dCiz()}
      if(s.sets[e.id].length>=e.sets)tost(`${LIB[e.k].n} tamam`)}
    else if(a==="setsil"){const s=gunSeansi(d.id);if(s&&s.sets[e.id]&&s.sets[e.id].length){s.sets[e.id].pop();kaydet(["s/"+s.sid])}}
    else if(a==="ekset"){e.sets++;kaydet(["main"])}

    ciz(true);return}
  if(a==="bitir")return bitir();
  if(a==="iptal"){if(b.dataset.on!=="1"){b.dataset.on="1";b.textContent="Emin misin? Tekrar dokun";return}
    const s=aktif();if(s){delete S.sessions[s.sid];S.activeSid=null;silinecek.add("s/"+s.sid);kaydet(["main"])}V.g={};D=null;dCiz();git("ana");return}
  if(a==="seansSil"){if(b.dataset.on!=="1"){b.dataset.on="1";b.textContent="Emin misin?";return}

  if(a==="kiloSil"){if(b.dataset.on!=="1"){b.dataset.on="1";b.textContent="Emin misin?";return}
    S.body=S.body.filter(x=>x.d!==b.dataset.d);kaydet(["main"]);ciz(true);tost("Kilo kaydı silindi");return}
  if(a==="kiloTum"){V.kiloTum=true;ciz(true);return}
  if(a==="kilo"){const v=sayi($("kiloGir").value);if(v<25||v>300){tost("Geçerli bir kilo gir, ör. 78,4");return}
    const t=bugun();S.body=S.body.filter(q=>q.d!==t);S.body.push({d:t,kg:Math.round(v*10)/10});kaydet(["main"]);ciz(true);tost("Kaydedildi");return}
  if(a==="salonGir"){S.plan.salonAcik=Date.now();kaydet(["main"]);ciz(true);return}
  if(a==="salonCik"){const g=S.plan.salonAcik;if(!g)return;const c=Date.now();(S.plan.salon=S.plan.salon||[]).push({id:uid(),g,c});delete S.plan.salonAcik;kaydet(["main"]);ciz(true);tost(`${dkYaz(Math.round((c-g)/60000))} salonda kaldın`);return}
  if(a==="hedef-"||a==="hedef+"){S.plan.sureHedef=Math.min(300,Math.max(5,sureHedef()+(a==="hedef+"?5:-5)));kaydet(["main"]);ciz(true);return}
  if(a==="salonDuzen")return salonDuzenAc(b.dataset.id);
  if(a==="salonKaydet"){const x=(S.plan.salon||[]).find(q=>q.id===b.dataset.id),sg=$("sg").value,sc=$("sc").value;if(!x||!sg||!sc)return;
    const kur=(ms,hm)=>{const d=new Date(ms),[h,m]=hm.split(":").map(Number);d.setHours(h,m,0,0);return d.getTime()};
    x.g=kur(x.g,sg);x.c=kur(x.g,sc);if(x.c<x.g)x.c+=86400000;kaydet(["main"]);perdeKapat();ciz(true);tost("Kaydedildi");return}
  if(a==="salonSil"){if(b.dataset.on!=="1"){b.dataset.on="1";b.textContent="Emin misin? Tekrar dokun";return}
    S.plan.salon=(S.plan.salon||[]).filter(q=>q.id!==b.dataset.id);kaydet(["main"]);perdeKapat();ciz(true);return}
  if(a==="secAc"){V.secGun=b.dataset.gun;V.q="";V.grp="";git("sec");return}
  if(a==="ekle"){const d=gunBul(V.secGun);if(!d)return;const k=b.dataset.k;
    /* çoklu seçim: ekranda kalınır; dokununca eklenir, tekrar dokununca çıkar */
    if(d.ex.some(e=>e.k===k)){d.ex=d.ex.filter(e=>e.k!==k);tost(`${LIB[k].n} çıkarıldı`)}
    else{d.ex.push(h(k,3,tipOf(k)==="sure"?"30-45":tipOf(k)==="kule"?"10-12":"8-12"));tost(`${LIB[k].n} eklendi`)}
    kaydet(["main"]);const l=$("secListe");if(l)l.innerHTML=secListe();const sb=$("secBitti");if(sb)sb.textContent=`Bitti · ${d.ex.length} hareket`;return}
  if(a==="hsil"){const d=gunBul(b.dataset.gun);if(d){d.ex=d.ex.filter(x=>x.id!==b.dataset.ex);kaydet(["main"])}ciz(true);return}
  if(a==="hzAc"){V.hzAcik=V.hzAcik===b.dataset.p?null:b.dataset.p;V.hzGun=0;ciz(true);return}
  if(a==="hzGun"){V.hzGun=+b.dataset.i;ciz(true);return}
  if(a==="hazirSec"){if(aktif()){tost("Önce açık antrenmanı bitir");return}

  if(a==="gekle"){const n=S.plan.days.length;S.plan.days.push({id:uid(),name:"Gün "+String.fromCharCode(65+n),wd:Math.min(6,n*2+1),ex:[]});kaydet(["main"]);ciz(true);return}
  if(a==="gsil"){if(b.dataset.on!=="1"){b.dataset.on="1";b.textContent="Emin misin?";return}
    S.plan.days=S.plan.days.filter(d=>d.id!==b.dataset.gun);if(V.gun===b.dataset.gun)V.gun=null;kaydet(["main"]);ciz(true);return}
  if(a==="goz"){const i=$(b.dataset.i);if(!i)return;const ac=i.type==="password";i.type=ac?"text":"password";b.innerHTML=ac?IK.gozK:IK.goz;b.setAttribute("aria-label",ac?"Şifreyi gizle":"Şifreyi göster");return}
  if(a==="kayitDegis"){V.kayit=!V.kayit;ciz();return}
  if(a==="giris"){const tel=telNorm($("gt").value),sf=$("gs").value,gh=$("gh");V.tel=$("gt").value;
    if(!tel){gh.textContent="Numarayı 0532 123 45 67 biçiminde yaz.";return}

    gh.textContent=V.kayit?"Hesap oluşturuluyor…":"Giriş yapılıyor…";
    try{const au=firebase.auth();V.kayit?await au.createUserWithEmailAndPassword(tel+ALAN,sf):await au.signInWithEmailAndPassword(tel+ALAN,sf);V.kayit=false}
    catch(e){const c=e.code||"";gh.textContent=/email-already-in-use/.test(c)?"Bu numarayla hesap zaten var, giriş yap.":/wrong-password|invalid-credential|user-not-found|invalid-login/.test(c)?"Numara ya da şifre hatalı.":/too-many/.test(c)?"Çok deneme yapıldı, biraz sonra tekrar dene.":"Giriş olmadı: "+(c||"bağlantı yok")}
    return}
  if(a==="linkKopya"){try{await navigator.clipboard.writeText(LINK);tost("Link kopyalandı")}catch(e){tost(LINK)}return}
  if(a==="uyeEkle"){if(!yoneticiMi())return;const tel=telNorm($("uyeTel").value),h=$("uyeHata");

    return}
  if(a==="uyeSil"){if(!yoneticiMi()||b.dataset.tel===YONETICI)return;if(b.dataset.on!=="1"){b.dataset.on="1";b.textContent="Emin misin?";return}

    return}
  if(a==="yerel"){V.yerel=true;ciz();return}

  if(a==="cikis"){await firebase.auth().signOut();V.yerel=false;izinYok=false;ciz();return}
});
