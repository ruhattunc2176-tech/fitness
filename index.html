<style>

   <div class="liste">${d.ex.map((x,i)=>{const n=kayitli(s,x).length,b=n>=x.sets;return `<button class="satir ${b?"bitti":""}" data-a="ac" data-i="${i}"><img src="${img(x.k,0)}" alt="" loading="lazy"><span class="ad">${esc(LIB[x.k].n)}<small>${b?"✓ tamam":n?`${n}/${x.sets} set`:`${x.sets} set × ${esc(x.reps)}${tipOf(x.k)==="sure"?" sn":""}`}</small></span><span class="hedef">${b?"✓":hedefYazi(x)}</span></button>`}).join("")||`<div class="satir">Bu günde hareket yok</div>`}</div>

    <button class="kutu" data-a="git" data-v="ilerleme"><span class="lbl">Bu hafta</span><span class="v">${ton.toLocaleString("tr-TR")}<small> kg</small></span><span class="s">${setN} sette kaldırdın</span></button>

   </div></div>`;
}
function sEx(){

      <div class="stack" style="gap:6px"><span class="lbl">Pimi tak</span><span class="buyuk">${yaz(g.kg)}<small>kg</small></span><span style="color:var(--chalk-m);font-size:14px;font-weight:500">Makinede pimi taktığın bloğa dokun</span></div>

  }
  const setler=Array.from({length:Math.max(e.sets,kay.length)},(_,j)=>{const x=kay[j];return x?`<span class="set"><i>✓</i>${tip==="sure"?x.r+" sn":tip==="vucut"?x.r+" tekrar":`${yaz(x.kg)} × ${x.r}`}</span>`:`<span class="set bos"><i></i>${j+1}. set</span>`}).join("");

function cizgi(pts,band){
  if(pts.length<2)return `<div class="meta">${pts.length?"Grafik için bir kayıt daha gerekli.":"Henüz kayıt yok."}</div>`;
  const W=340,H=170,L=40,R=14,T=12,B=26;let ys=pts.map(p=>p.y);if(band)ys=ys.concat(band);
  let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<2){lo-=1;hi+=1}const pd=(hi-lo)*.12;lo-=pd;hi+=pd;
  const X=i=>L+(W-L-R)*(i/(pts.length-1)),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const tk=[lo+(hi-lo)*.15,(lo+hi)/2,hi-(hi-lo)*.15];
  const yol=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");const sp=pts[pts.length-1];
  return `<svg class="grafik" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik">
   ${band?`<rect x="${L}" y="${Y(band[1])}" width="${W-L-R}" height="${Y(band[0])-Y(band[1])}" fill="var(--ok)" fill-opacity=".16" rx="4"/>`:""}
   ${tk.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${yaz(Math.round(t*10)/10)}</text>`).join("")}
   <path d="${yol}" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i===pts.length-1?6:3}" fill="${i===pts.length-1?"var(--p25)":"var(--ink)"}"/>`).join("")}
   <text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">${tarih(pts[0].d)}</text><text x="${W-R}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">${tarih(sp.d)}</text></svg>`;
}

   <section class="kart"><h3>Güç gelişimi</h3>
    ${ks.length?`<select class="alan" id="pkSec" aria-label="Hareket seç">${ks.map(k=>`<option value="${k}" ${k===V.pk?"selected":""}>${esc(LIB[k].n)}</option>`).join("")}</select>

    <div>${gec.length?gec.map(s=>`<div class="gecmis"><span><b>${esc(s.dayName)}</b> <span class="meta">${tarih(s.date)}</span>${rek.has(s.sid)?`<span class="etk">Rekor</span>`:""}</span><span class="s">${biten(s)} set · ${Math.round(hacim(s)).toLocaleString("tr-TR")} kg</span></div>`).join(""):`<div class="meta">Bitirdiğin antrenmanlar burada listelenir.</div>`}</div></section>
  </div>`;
}

  return `<div class="giris"><span class="mark"><i></i><i></i>FITNESS</span>
   <section class="iron">${barSVG([20,10,5])}<span class="lbl">${yeni?"İlk giriş: numaranı yaz, kendine bir şifre belirle":"Telefon numaran ve şifrenle gir"}</span></section>
   <input class="alan" id="gt" type="tel" inputmode="tel" autocomplete="tel" placeholder="0532 123 45 67" value="${esc(V.tel||"")}">
   <input class="alan" id="gs" type="password" autocomplete="${yeni?"new-password":"current-password"}" placeholder="${yeni?"Yeni şifre (en az 6 karakter)":"Şifre"}">
   ${yeni?`<input class="alan" id="gs2" type="password" autocomplete="new-password" placeholder="Şifreyi tekrar yaz">`:""}
   <div class="hata" id="gh"></div>
   <button class="btn-k" data-a="giris">${yeni?"Hesabı oluştur":"Giriş yap"}</button>
   <button class="btn" data-a="kayitDegis">${yeni?"Hesabım var, giriş yap":"İlk kez mi giriyorsun? Hesap oluştur"}</button>
   <button class="link" data-a="yerel">Giriş yapmadan bu cihazda kullan</button></div>`;
}

/* ---------- çizim, sekmeler, kaldığın yer ---------- */
const SEKMELER=[["ana","Bugün",IK.bugun],["ilerleme","İlerleme",IK.ilerleme],["lib","Hareketler",IK.hareket],["program","Program",IK.program]];
function ciz(yerinde){
  const y=window.scrollY;
  const girisGerek=fbDurum==="hazir"&&((!kul&&!V.yerel)||izinYok);
  $("app").innerHTML=girisGerek?sGiris():V.v==="ex"?sEx():V.v==="lib"?sLib():V.v==="ilerleme"?sIlerleme():V.v==="program"?sProgram():V.v==="ayar"?sAyar():sAna();
  const t=$("tabs");t.hidden=girisGerek||V.v==="ex";
  if(!t.hidden)t.innerHTML=SEKMELER.map(([v,a,ik])=>`<button class="${V.v===v?"on":""}" data-a="git" data-v="${v}">${ik}${a}</button>`).join("");
  if(V.v==="ex"){const r=$("raf");const sl=r&&r.querySelector(".secili");if(sl)r.scrollLeft=sl.offsetLeft-r.clientWidth/2+sl.clientWidth/2}
  if(yerinde)window.scrollTo(0,y);
  gorunumKaydet();
}
function gorunumKaydet(){V.y=window.scrollY;try{localStorage.setItem(LSV,JSON.stringify(V))}catch(e){}}
let kT;window.addEventListener("scroll",()=>{clearTimeout(kT);kT=setTimeout(gorunumKaydet,200)},{passive:true});
function git(v,ek){Object.assign(V,{v},ek||{});ciz();window.scrollTo(0,0)}
function tost(t){const el=$("tost");el.textContent=t;el.hidden=false;clearTimeout(tost.t);tost.t=setTimeout(()=>el.hidden=true,2800)}

/* ---------- dinlenme: tükenen plaka ---------- */
let D=null,DI=null;
function dinlen(sn,sonraki){D={son:Date.now()+sn*1000,top:sn,sonraki};dCiz();clearInterval(DI);DI=setInterval(dCiz,250)}
function dCiz(){const el=$("dinlen");if(!D){el.hidden=true;clearInterval(DI);return}
  const k=Math.max(0,(D.son-Date.now())/1000);if(k<=0){D=null;el.hidden=true;clearInterval(DI);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}tost("Dinlenme bitti, bara geç");return}
  const C=2*Math.PI*34,o=k/D.top,ks=Math.ceil(k);
  el.hidden=false;el.innerHTML=`<div><svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="40" fill="var(--iron2)"/><circle cx="42" cy="42" r="34" fill="none" stroke="var(--p25)" stroke-width="12" stroke-dasharray="${(C*o).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 42 42)"/><circle cx="42" cy="42" r="9" fill="var(--iron)"/></svg>
   <div class="y"><b>${Math.floor(ks/60)}:${pad(ks%60)}</b><span>Dinlen · sırada ${esc(D.sonraki)}</span></div>
   <div class="bt"><button data-a="d15">+15 sn</button><button data-a="dgec">Geç</button></div></div>`}

/* ---------- olaylar ---------- */
function exAktif(){const d=gunBul(V.gun);return d&&d.ex[V.i]?{d,e:d.ex[V.i]}:null}
function bitir(){const s=aktif();
  if(!s||!biten(s)){if(s){delete S.sessions[s.sid];S.activeSid=null;silinecek.add("s/"+s.sid);kaydet(["main"])}V.g={};D=null;dCiz();git("ana");return}
  s.done=true;s.end=Date.now();S.activeSid=null;V.g={};V.gun=null;D=null;dCiz();kaydet(["main","s/"+s.sid]);
  git("ana");tost(`Bitti: ${biten(s)} set · ${Math.round(hacim(s)).toLocaleString("tr-TR")} kg kaldırdın`)}
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a;
  if(a==="git")return git(b.dataset.v);
  if(a==="gunSec"){V.gun=b.dataset.id;ciz(true);return}
  if(a==="ac")return git("ex",{i:+b.dataset.i});
  if(a==="d15"){if(D){D.son+=15000;D.top+=15;dCiz()}return}
  if(a==="dgec"){D=null;dCiz();return}
  if(a==="grp"){V.grp=b.dataset.g;ciz(true);return}
  const x=V.v==="ex"&&exAktif();
  if(x&&["tak","cikar","bosalt","pin","dmb","kule+","kule-","r-","r+","kaydet","setsil"].includes(a)){
    const {d,e}=x,g=giris(e),tip=tipOf(e.k);
    if(a==="tak"){const p=+b.dataset.p;if(g.yan.reduce((t,q)=>t+PL[q].t+2,0)+PL[p].t>140){tost("Barda yer kalmadı");return}
      g.yan.push(p);g.yan.sort((m,n)=>n-m);g.yeni=g.yan.lastIndexOf(p)}
    else if(a==="cikar"){g.yan.pop();g.yeni=-1}
    else if(a==="bosalt"){g.yan=[];g.yeni=-1}
    else if(a==="pin"||a==="dmb")g.kg=+b.dataset.w;
    else if(a==="kule+")g.kg+=5;
    else if(a==="kule-")g.kg=Math.max(5,g.kg-5);
    else if(a==="r-"||a==="r+"){const ad=tip==="sure"?5:1;g.r=Math.max(ad,g.r+(a==="r+"?ad:-ad))}
    else if(a==="kaydet"){const s=seansAc(d.id);s.keys[e.id]=e.k;(s.sets[e.id]=s.sets[e.id]||[]).push({kg:girisKg(e),r:g.r,ok:true});g.yeni=-1;kaydet(["main","s/"+s.sid]);
      const n=s.sets[e.id].length;
      if(n<e.sets)dinlen(e.rest,`${n+1}. set`);else{const nx=d.ex[V.i+1];if(nx)dinlen(e.rest,LIB[nx.k].n);else{D=null;dCiz()}tost(`${LIB[e.k].n} bitti`)}}
    else if(a==="setsil"){const s=gunSeansi(d.id);if(s&&s.sets[e.id]&&s.sets[e.id].length){s.sets[e.id].pop();kaydet(["s/"+s.sid])}}
    ciz(true);return}
  if(a==="sonraki"){const d=gunBul(V.gun);if(d&&V.i<d.ex.length-1){V.i++;ciz();scrollTo(0,0)}return}
  if(a==="onceki"){if(V.i>0){V.i--;ciz();scrollTo(0,0)}return}
  if(a==="bitir")return bitir();
  if(a==="iptal"){if(b.dataset.on!=="1"){b.dataset.on="1";b.textContent="Emin misin? Tekrar dokun";return}
    const s=aktif();if(s){delete S.sessions[s.sid];S.activeSid=null;silinecek.add("s/"+s.sid);kaydet(["main"])}V.g={};D=null;dCiz();git("ana");return}
  if(a==="kilo"){const v=sayi($("kiloGir").value);if(v<25||v>300){tost("Geçerli bir kilo gir, ör. 78,4");return}
    const t=bugun();S.body=S.body.filter(q=>q.d!==t);S.body.push({d:t,kg:Math.round(v*10)/10});kaydet(["main"]);ciz(true);tost("Kaydedildi");return}
  if(a==="libekle"){const gd=gunBul($("ekg-"+b.dataset.k).value);if(!gd)return;gd.ex.push(h(b.dataset.k,3,tipOf(b.dataset.k)==="sure"?"30-45":"8-12"));kaydet(["main"]);tost(`${LIB[b.dataset.k].n}, ${gd.name} gününe eklendi`);ciz(true);return}
  if(a==="hekle"){const gd=gunBul(b.dataset.gun);gd.ex.push(h("goblet",3,"8-12"));kaydet(["main"]);ciz(true);return}
  if(a==="hsil"){const gd=gunBul(b.dataset.gun);gd.ex=gd.ex.filter(e=>e.id!==b.dataset.ex);kaydet(["main"]);ciz(true);return}
  if(a==="gekle"){const n=S.plan.days.length;S.plan.days.push({id:uid(),name:"Gün "+String.fromCharCode(65+n),wd:Math.min(6,n*2+1),ex:[]});kaydet(["main"]);ciz(true);return}
  if(a==="gsil"){if(b.dataset.on!=="1"){b.dataset.on="1";b.textContent="Emin misin? Tekrar dokun";return}
    S.plan.days=S.plan.days.filter(d=>d.id!==b.dataset.gun);if(V.gun===b.dataset.gun)V.gun=null;kaydet(["main"]);ciz(true);return}
  if(a==="kayitDegis"){V.kayit=!V.kayit;ciz();return}
  if(a==="giris"){const tel=telNorm($("gt").value),sf=$("gs").value,gh=$("gh");V.tel=$("gt").value;
    if(!tel){gh.textContent="Numarayı 0532 123 45 67 biçiminde yaz.";return}
    if(sf.length<6){gh.textContent="Şifre en az 6 karakter olmalı.";return}
    if(V.kayit&&sf!==$("gs2").value){gh.textContent="Şifreler aynı değil.";return}
    gh.textContent=V.kayit?"Hesap oluşturuluyor…":"Giriş yapılıyor…";
    try{const au=firebase.auth();V.kayit?await au.createUserWithEmailAndPassword(tel+ALAN,sf):await au.signInWithEmailAndPassword(tel+ALAN,sf);V.kayit=false}
    catch(e){const c=e.code||"";gh.textContent=/email-already-in-use/.test(c)?"Bu numarayla hesap zaten var, giriş yap.":/wrong-password|invalid-credential|user-not-found|invalid-login/.test(c)?"Numara ya da şifre hatalı.":/too-many/.test(c)?"Çok deneme yapıldı, biraz sonra tekrar dene.":/operation-not-allowed/.test(c)?"Giriş yöntemi henüz açılmamış.":"Giriş olmadı: "+(c||"bağlantı yok")}
    return}
  if(a==="yerel"){V.yerel=true;ciz();return}
  if(a==="girisAc"){V.yerel=false;ciz();return}
  if(a==="cikis"){await firebase.auth().signOut();V.yerel=false;izinYok=false;ciz();return}
});
document.addEventListener("input",ev=>{const t=ev.target;
  if(t.id==="q"){V.q=t.value;$("libliste").innerHTML=libListe();return}});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.id==="pkSec"){V.pk=t.value;ciz(true);return}
  if(t.dataset.pf){const d=gunBul(t.dataset.gun);d[t.dataset.pf]=t.dataset.pf==="wd"?+t.value:t.value;kaydet(["main"]);return}
  if(t.dataset.ef){const d=gunBul(t.dataset.gun),e=d.ex.find(q=>q.id===t.dataset.ex);let v=t.value;
    if(t.dataset.ef==="sets"){v=Math.max(1,Math.min(10,parseInt(v)||e.sets));t.value=v}
    if(t.dataset.ef==="k"){e.rest=varsayDn(v);delete V.g[e.id]}
    e[t.dataset.ef]=v;kaydet(["main"])}});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&/^(gs|gs2|gt)$/.test(ev.target.id)){const b=document.querySelector('[data-a="giris"]');b&&b.click()}});

ciz();requestAnimationFrame(()=>window.scrollTo(0,V.y||0));
fbBaslat();
</script>
</body></html>
