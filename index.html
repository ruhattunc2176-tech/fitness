<style>
/* Tarz: neo-brutalist — sarı zemin, kalın siyah çizgi, sert gölge, tek turuncu vurgu */
:root{
  --bg:#FFE14D; --card:#FFFFFF; --ink:#000000; --muted:#4A4A4A; --line:#000000; --soft:#FFF4B8;
  --ac:#FF5A36; --ac-ink:#000000; --ac-s:#FFD3C7; --ok:#2BD46B; --ok-ink:#000000; --ok-s:#C8F5D8; --ok-yazi:#0B7A35; --warn:#B45309; --kir:#D21F1F;
  --sh:5px 5px 0 #000; --sh-k:3px 3px 0 #000; --r:10px;
  --f:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;font-weight:500;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(116px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:34px;font-weight:900;line-height:1;letter-spacing:-.01em;text-transform:uppercase}
h2{margin:0;font-size:20px;font-weight:900;text-transform:uppercase}
.lb{font-size:14px;color:var(--muted);font-weight:600}
.k{background:var(--card);border-radius:var(--r);border:3px solid var(--line);box-shadow:var(--sh)}
.pad{padding:14px;display:flex;flex-direction:column;gap:12px}
.ust{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{border:3px solid #000;border-radius:var(--r);background:var(--ac);color:#000;font-weight:800;font-size:18px;letter-spacing:.03em;text-transform:uppercase;padding:14px;width:100%;box-shadow:4px 4px 0 #000;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 #000}
.btn:disabled{opacity:.45}
.btn.ikincil{background:#fff;font-size:15px;padding:10px}
.btn.kucuk{width:auto;font-size:15px;padding:10px 16px}
.btn.yesil{background:var(--ok)}
.btn.kir{background:#fff;color:var(--kir);font-size:15px;padding:10px}
.ikb{width:46px;height:46px;border-radius:var(--r);border:3px solid #000;background:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--sh-k)}
.ikb:active{transform:translate(3px,3px);box-shadow:none}
.ikb svg{width:22px;height:22px}
.geri{border:0;background:none;color:#000;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.03em;padding:4px 0;align-self:flex-start;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.cipler{display:flex;gap:8px;overflow-x:auto;padding:0 4px 4px 0}
.cip{flex:none;border:2.5px solid #000;background:#fff;border-radius:8px;padding:7px 14px;font-weight:700;font-size:15px;color:#000}
.cip.on{background:#000;color:var(--bg)}
.iki{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.st{padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;border:3px solid #000;background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.st:active{transform:translate(5px,5px);box-shadow:none}
.st b{font-size:28px;font-weight:900;line-height:1.1}
.st .iyi{color:var(--ok-yazi);font-weight:800;font-size:14px}
.st .dikkat{color:var(--warn);font-weight:800;font-size:14px}
.sat{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-top:2px solid #000;background:none;width:100%;text-align:left}
.sat:first-child{border-top:0}
.k.sat{border:3px solid #000;background:var(--card)}
.k.sat:active{transform:translate(5px,5px);box-shadow:none}
.sat img{width:48px;height:48px;border-radius:8px;border:2px solid #000;object-fit:cover;flex:none;background:var(--soft);display:block}
.buyut{position:relative;flex:none;display:block;cursor:zoom-in}
.buyut i{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:5px;background:var(--bg);border:2px solid #000;color:#000;font-style:normal;font-size:11px;font-weight:900;display:grid;place-items:center;line-height:1}
.sat .a{flex:1;min-width:0}
.sat .a b{display:block;font-size:17px;font-weight:800;line-height:1.2}
.sat .a span{font-size:14px;color:var(--muted);font-weight:600}
.sat .v{font-size:16px;font-weight:800;color:#000;white-space:nowrap}
.sat .ok{width:28px;height:28px;border-radius:6px;background:var(--ok);border:2.5px solid #000;color:#000;display:grid;place-items:center;font-size:15px;font-weight:900;flex:none}
.sat .bos{width:28px;height:28px;border-radius:6px;border:2.5px solid #000;background:#fff;flex:none}
/* antrenman kartı */
.hk{padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:6px 6px 0 var(--ac)}
.hb{display:flex;gap:12px;align-items:center}
.hb>div{flex:1;min-width:0}
.kk{flex:none;align-self:flex-start;width:40px;height:40px;border-radius:8px;border:2.5px solid #000;background:var(--bg);color:#000;display:grid;place-items:center;padding:0}
.kk:active{transform:scale(.94)}
.kk svg{width:20px;height:20px}
.hb .foto{width:72px;height:72px;border-radius:var(--r);overflow:hidden;flex:none;border:3px solid #000;padding:0;background:var(--soft)}
.hb .foto img{width:100%;height:100%;object-fit:cover;display:block}
.hb b{display:block;font-size:22px;font-weight:900;line-height:1.1}
.hb .bil{font-size:14px;color:var(--muted);font-weight:600}
.link{border:0;background:none;padding:0;color:#000;font-weight:800;font-size:15px;text-decoration:underline;text-decoration-color:var(--ac);text-decoration-thickness:3px;text-underline-offset:3px}
.gec{font-size:15px;color:var(--muted);font-weight:600}
.oner{font-size:15px;font-weight:700;background:var(--ac-s);color:#000;border:2.5px solid #000;border-radius:8px;padding:8px 11px}
.yset{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;padding:8px 11px;border-radius:8px;border:2.5px solid #000;background:var(--ok-s);color:#000}
.yset i{width:22px;height:22px;border-radius:5px;background:var(--ok);border:2px solid #000;color:#000;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:900;flex:none}
.yset button{margin-left:auto;border:0;background:none;color:inherit;font-weight:700;font-size:14px;padding:0;text-decoration:underline}
.akt{background:var(--soft);border:2.5px solid #000;border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:12px}
.akt .t{align-self:flex-start;font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;background:#000;color:var(--bg);border-radius:6px;padding:3px 9px}
.ad{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ad .ad-l{font-size:16px;font-weight:800}
.ad .ad-l small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.ad .r{display:flex;align-items:center;gap:6px}
.ad button{width:50px;height:50px;border-radius:8px;border:3px solid #000;background:#fff;font-size:26px;font-weight:800;display:grid;place-items:center;box-shadow:var(--sh-k);transition:transform .06s,box-shadow .06s}
.ad button:active{transform:translate(3px,3px);box-shadow:none}
.ad input{width:88px;text-align:center;font-size:38px;font-weight:900;border:0;background:none;padding:0;font-variant-numeric:tabular-nums;line-height:1}
.ad input:focus{outline:3px solid var(--ac);border-radius:8px}
.sure{font-size:16px;color:#000;font-weight:800;font-variant-numeric:tabular-nums}
/* dinlenme */
.din{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(18px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none}
.din>div{pointer-events:auto;width:100%;max-width:496px;background:#000;color:#fff;border:3px solid #000;border-radius:var(--r);padding:11px 13px;display:flex;align-items:center;gap:12px;box-shadow:5px 5px 0 var(--ac)}
.din b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;min-width:62px;color:var(--bg)}
.din .bar{flex:1;height:10px;border-radius:3px;background:#3A3A3A;overflow:hidden}
.din .bar i{display:block;height:100%;background:var(--bg)}
.din button{border:0;background:#fff;color:#000;font-weight:800;font-size:14px;padding:8px 11px;border-radius:6px}
/* alt menü */
.tab{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:3px solid #000;display:flex;justify-content:center;gap:6px;padding:8px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
.tab button{flex:1;max-width:160px;border:2.5px solid transparent;border-radius:8px;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:#000;padding:5px 0}
.tab button.on{background:var(--bg);border-color:#000;box-shadow:var(--sh-k)}
.tab svg{width:24px;height:24px}
/* büyük fotoğraf */
.perde{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.perde>div{width:100%;max-width:520px;background:var(--card);border:3px solid #000;border-radius:12px;box-shadow:5px 5px 0 var(--ac);padding:14px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.perde h2{text-transform:none;font-size:22px}
.fotolar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fotolar figure{margin:0;display:flex;flex-direction:column;gap:4px}
.fotolar img{width:100%;aspect-ratio:3/2;object-fit:contain;border:2px solid #000;border-radius:8px;background:var(--soft)}
.fotolar figcaption{font-size:13px;color:#000;font-weight:800;text-align:center;text-transform:uppercase}
/* formlar */
.alan{width:100%;min-width:0;background:#fff;border:2.5px solid #000;border-radius:8px;padding:11px;font-size:16px;font-weight:600}
.alan:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
.duz{display:grid;grid-template-columns:44px minmax(0,1fr) 46px 64px 36px;gap:8px;align-items:center;padding:9px 0;border-top:2px solid #000}
.duz img{width:44px;height:44px;border-radius:8px;border:2px solid #000;object-fit:cover;display:block}
.duz b{font-size:15px;font-weight:800;line-height:1.2}
.duz .alan{padding:7px 4px;font-size:15px;font-weight:700;text-align:center}
.sil{height:36px;width:36px;border:2.5px solid #000;border-radius:8px;background:#fff;color:#000;display:grid;place-items:center;padding:0}
.sil:active{background:var(--ac)}
.sil svg{width:18px;height:18px}
.gb{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:66px;border-top:2px solid #000;font-size:15px;font-weight:700;color:#000;overflow:hidden}
.gb span{min-width:0}
.gb button{border:2.5px solid #000;background:#000;color:var(--bg);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.03em;padding:8px 12px;border-radius:8px;flex:none}
.gb i{position:absolute;left:0;bottom:0;height:5px;background:var(--ac);width:100%;animation:gbaz linear forwards}
@keyframes gbaz{to{width:0}}
.gbk{padding:0 14px}.gbk .gb{border-top:0}
.pad>.gb{margin:0 -14px -14px;padding:0 14px}
.prg{display:flex;align-items:center;gap:12px}
.prg>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prg small{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.prg b{font-size:21px;font-weight:900;line-height:1.15}
.prg span{font-size:14px;color:var(--muted);font-weight:600}
.prg .btn{width:auto;flex:none;padding:10px 14px}
.hp{padding:14px;display:flex;flex-direction:column;gap:9px}
.hp.on{box-shadow:6px 6px 0 var(--ac)}
.hp .u{display:flex;align-items:center;gap:10px}
.hp .no{flex:none;width:30px;height:30px;border-radius:6px;background:#000;color:var(--bg);display:grid;place-items:center;font-weight:900;font-size:15px}
.hp.on .no{background:var(--ac);color:#000;border:2.5px solid #000}
.hp .u b{flex:1;min-width:0;font-size:19px;font-weight:900;line-height:1.15}
.hp .et{flex:none;font-size:12px;font-weight:900;text-transform:uppercase;color:#000;background:var(--bg);border:2px solid #000;border-radius:6px;padding:2px 8px}
.hp .hd{font-size:15px;font-weight:600}
.hp .c{display:flex;flex-wrap:wrap;gap:6px}
.hp .c span{font-size:13px;font-weight:700;background:var(--soft);color:#000;border:2px solid #000;border-radius:6px;padding:2px 8px}
.hp details{font-size:14px;color:var(--muted);font-weight:600}
.hp summary{font-weight:800;color:#000;padding:6px 0;cursor:pointer}
.hp details p{margin:4px 0 6px}
.hp details p b{color:#000;font-weight:800}
.hp .btn{font-size:15px;padding:11px}
.grafik{width:100%;height:auto;display:block}
.satir2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:16px;font-weight:600;padding:8px 0;border-top:2px solid #000}
.satir2:first-of-type{border-top:0}
.satir2 .art{color:var(--ok-yazi);font-weight:800}
.hata{font-size:14px;color:var(--kir);font-weight:700;min-height:1.2em}

.tost{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#000;color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:800;z-index:50;max-width:90vw;text-align:center;font-size:15px;box-shadow:4px 4px 0 var(--ac)}
.surum{font-size:12px;color:#000;opacity:.65;font-weight:700;text-align:center;margin:-8px 0 -6px}
.logo{width:60px;height:60px;border-radius:12px;border:3px solid #000;box-shadow:var(--sh-k)}
</style></head><body>

const SEKME=[["ana","Bugün",IK.bugun],["gelisim","Gelişim",IK.gelisim],["program","Program",IK.program]];
function ciz(yerinde){
  if(V.v!=="program"&&!(V.v==="hazir"&&BEKLE.sifir))silHepsiniBitir();
  const y=window.scrollY,girisGerek=fbDurum==="hazir"&&((!kul&&!V.yerel)||izinYok);
  $("app").innerHTML=`<div class="surum">Son güncelleme: ${surumYazi()}</div>`+(girisGerek?sGiris():V.v==="ant"?sAnt():V.v==="gelisim"?sGelisim():V.v==="program"?sProgram():V.v==="sec"?sSec():V.v==="hazir"?sHazir():V.v==="ayar"?sAyar():sAna());
  const t=$("tab");t.hidden=girisGerek||V.v==="ant";
  if(!t.hidden){const akt=V.v==="sec"||V.v==="hazir"?"program":V.v==="ayar"?"ana":V.v;t.innerHTML=SEKME.map(([v,a,ik])=>`<button class="${akt===v?"on":""}" data-a="git" data-v="${v}">${ik}${a}</button>`).join("")}
  if(yerinde)window.scrollTo(0,y);

}
function gorunumKaydet(){V.y=window.scrollY;try{localStorage.setItem(LSV,JSON.stringify(V))}catch(e){}}
let kT;window.addEventListener("scroll",()=>{clearTimeout(kT);kT=setTimeout(gorunumKaydet,200)},{passive:true});
/* telefonun geri tuşu: ekran derinliğine göre tarihçe */
const DERIN={ana:0,gelisim:1,program:1,ant:1,ayar:1,sec:2,hazir:2};
const derin=v=>DERIN[v]??0;
let hedef=null;
function git(v,ek){Object.assign(V,ek||{});const fark=derin(v)-derin(V.v);
  if(fark<0&&history.state&&history.state.v){hedef=v;history.go(fark);return}
  if(fark>0)history.pushState({v},"");else history.replaceState({v},"");
  V.v=v;ciz();window.scrollTo(0,0)}
function tarihceKur(){try{history.replaceState({v:"ana"},"");if(V.v==="sec"||V.v==="hazir"){history.pushState({v:"program"},"");history.pushState({v:V.v},"")}else if(derin(V.v)>0)history.pushState({v:V.v},"")}catch(e){}}
window.addEventListener("popstate",ev=>{
  if(!$("perde").hidden){$("perde").hidden=true;return}
  const st=ev.state&&ev.state.v?ev.state.v:"ana";
  if(hedef){V.v=hedef;hedef=null;if(V.v!==st)history.replaceState({v:V.v},"")}else V.v=st;
  ciz();window.scrollTo(0,0)});
function perdeKapat(){if($("perde").hidden)return;if(history.state&&history.state.perde)history.back();else $("perde").hidden=true}
const BEKLE={};
function geriSerit(id,yazi){const p=BEKLE[id];const gecen=Math.max(0,p.sure-(p.bit-Date.now()));return `<div class="gb" id="gb-${id}"><span>${esc(yazi)}</span><button data-a="geriAl" data-id="${id}">Geri al</button><i style="animation-duration:${p.sure}ms;animation-delay:-${gecen}ms"></i></div>`}
function silBekle(id,tip,gun,sure,kopya){if(BEKLE[id])clearTimeout(BEKLE[id].t);BEKLE[id]={tip,gun,sure,kopya,bit:Date.now()+sure,t:setTimeout(()=>silBitir(id),sure)}}
function silUygula(id){const p=BEKLE[id];if(!p)return false;clearTimeout(p.t);delete BEKLE[id];
  if(p.tip==="gun"){S.plan.days=S.plan.days.filter(d=>d.id!==id);if(V.gun===id)V.gun=null}
  else if(p.tip==="ex"){const d=gunBul(p.gun);if(d)d.ex=d.ex.filter(x=>x.id!==id)}
  return true}
function silBitir(id){if(!silUygula(id))return;kaydet(["main"]);
  const ae=document.activeElement,yaziyor=ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName);
  if(V.v==="program"&&!yaziyor)ciz(true);else{const el=$("gb-"+id);if(el)(el.parentNode.classList.contains("gbk")?el.parentNode:el).remove()}}
function silHepsiniBitir(){const ids=Object.keys(BEKLE);if(!ids.length)return;ids.forEach(silUygula);kaydet(["main"])}
document.addEventListener("visibilitychange",()=>{if(document.hidden)silHepsiniBitir()});
function tost(t){const el=$("tost");el.textContent=t;el.hidden=false;clearTimeout(tost.t);tost.t=setTimeout(()=>el.hidden=true,2600)}
function kartaKaydir(){requestAnimationFrame(()=>{const el=document.querySelector(".hk");if(el){const r=el.getBoundingClientRect();if(r.top<0||r.top>window.innerHeight*.5)window.scrollTo({top:window.scrollY+r.top-12,behavior:"smooth"})}})}
setInterval(()=>{const el=$("gecen");const s=aktif();if(el&&s)el.textContent=gecenSure(s)},1000);

let D=null,DI=null;
function dinlen(sn){D={son:Date.now()+sn*1000,top:sn};dCiz();clearInterval(DI);DI=setInterval(dCiz,250)}
function dCiz(){const el=$("din");if(!D){el.hidden=true;clearInterval(DI);return}
  const k=Math.max(0,(D.son-Date.now())/1000);if(k<=0){D=null;el.hidden=true;clearInterval(DI);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}tost("Dinlenme bitti");return}
  const ks=Math.ceil(k);el.hidden=false;
  el.innerHTML=`<div><b>${Math.floor(ks/60)}:${pad(ks%60)}</b><span class="bar"><i style="width:${(k/D.top*100).toFixed(1)}%"></i></span><span style="font-size:14px">Dinlen</span><button data-a="d15">+15</button><button data-a="dgec">Geç</button></div>`}

/* ---------- olaylar ---------- */
function acikEx(){const d=gunBul(V.gun);const e=d&&d.ex.find(x=>x.id===V.acik);return e?{d,e}:null}
function bitir(){const s=aktif();
  if(!s||!biten(s)){if(s){delete S.sessions[s.sid];S.activeSid=null;silinecek.add("s/"+s.sid);kaydet(["main"])}V.g={};D=null;dCiz();git("ana");return}
  s.done=true;s.end=Date.now();S.activeSid=null;V.g={};V.gun=null;D=null;dCiz();kaydet(["main","s/"+s.sid]);
  git("ana");tost(`Bravo! ${biten(s)} set tamamlandı`)}
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a;
  if(a==="git")return git(b.dataset.v);
  if(a==="gunSec"){V.gun=b.dataset.id;ciz(true);return}
  if(a==="basla"){V.acik=b.dataset.ex||null;git("ant");kartaKaydir();return}
  if(a==="kartKapat"){V.acik="-";ciz(true);return}
  if(a==="ac"){V.acik=b.dataset.ex;ciz(true);kartaKaydir();return}
  if(a==="foto")return fotoAc(b.dataset.k);
  if(a==="kapat"){perdeKapat();return}
  if(a==="d15"){if(D){D.son+=15000;D.top+=15;dCiz()}return}
  if(a==="dgec"){D=null;dCiz();return}
  if(a==="grp"){V.grp=b.dataset.g;ciz(true);return}
  const x=V.v==="ant"&&acikEx();
  if(x&&["kg-","kg+","r-","r+","tamamla","setsil","sonraki","ekset"].includes(a)){
    const {d,e}=x,g=giris(e),tip=tipOf(e.k);
    if(a==="kg+"||a==="kg-"){const yukari=a==="kg+";
      if(tip==="dambil"){const i=DMB.findIndex(v=>v>=g.kg);g.kg=yukari?(DMB.find(v=>v>g.kg)??g.kg+2):([...DMB].reverse().find(v=>v<g.kg)??Math.max(0,g.kg-1))}
      else g.kg=Math.max(0,Math.round((g.kg+(yukari?1:-1)*adim(e.k))*100)/100)}
    else if(a==="r+"||a==="r-"){const st=tip==="sure"?5:1;g.r=Math.max(st,g.r+(a==="r+"?st:-st))}
    else if(a==="tamamla"){const s=seansAc(d.id);s.keys[e.id]=e.k;(s.sets[e.id]=s.sets[e.id]||[]).push({kg:kiloVar(e.k)?g.kg:0,r:g.r,ok:true});kaydet(["main","s/"+s.sid]);
      if(s.sets[e.id].length<e.sets||d.ex.some(q=>!tamamMi(s,q)))dinlen(e.rest);else{D=null;dCiz()}
      if(s.sets[e.id].length>=e.sets)tost(`${LIB[e.k].n} tamam`)}
    else if(a==="setsil"){const s=gunSeansi(d.id);if(s&&s.sets[e.id]&&s.sets[e.id].length){s.sets[e.id].pop();kaydet(["s/"+s.sid])}}
    else if(a==="ekset"){e.sets++;kaydet(["main"])}
    else if(a==="sonraki"){const s=gunSeansi(d.id);const nx=d.ex.find(q=>!tamamMi(s,q));if(!nx)return bitir();V.acik=nx.id;ciz(true);kartaKaydir();return}
    ciz(true);return}
  if(a==="bitir")return bitir();
  if(a==="iptal"){if(b.dataset.on!=="1"){b.dataset.on="1";b.textContent="Emin misin? Tekrar dokun";return}
    const s=aktif();if(s){delete S.sessions[s.sid];S.activeSid=null;silinecek.add("s/"+s.sid);kaydet(["main"])}V.g={};D=null;dCiz();git("ana");return}
  if(a==="kilo"){const v=sayi($("kiloGir").value);if(v<25||v>300){tost("Geçerli bir kilo gir, ör. 78,4");return}
    const t=bugun();S.body=S.body.filter(q=>q.d!==t);S.body.push({d:t,kg:Math.round(v*10)/10});kaydet(["main"]);ciz(true);tost("Kaydedildi");return}
  if(a==="secAc"){V.secGun=b.dataset.gun;V.q="";V.grp="";git("sec");return}
  if(a==="ekle"){const d=gunBul(V.secGun);if(!d)return;const k=b.dataset.k;if(d.ex.some(e=>e.k===k)){tost("Bu hareket zaten bu günde var");return}
    d.ex.push(h(k,3,tipOf(k)==="sure"?"30-45":tipOf(k)==="kule"?"10-12":"8-12"));kaydet(["main"]);tost(`${LIB[k].n} eklendi`);git("program");return}
  if(a==="geriAl"){const p=BEKLE[b.dataset.id];if(p){clearTimeout(p.t);delete BEKLE[b.dataset.id];if(p.tip==="sifir"){const o=JSON.parse(p.kopya);S.plan.days=o.days;if(o.prog)S.plan.prog=o.prog;else delete S.plan.prog;V.g={};V.gun=null;kaydet(["main"])}ciz(true)}return}
  if(a==="hsil"){silBekle(b.dataset.ex,"ex",b.dataset.gun,4000);ciz(true);return}
  if(a==="hazirSec"){if(aktif()){tost("Önce açık antrenmanı bitir");return}
    silHepsiniBitir();const kopya=JSON.stringify({days:S.plan.days,prog:S.plan.prog||""});hazirYukle(b.dataset.p);silBekle("sifir","sifir",null,8000,kopya);kaydet(["main"]);git("program");return}
  if(a==="gekle"){const n=S.plan.days.length;S.plan.days.push({id:uid(),name:"Gün "+String.fromCharCode(65+n),wd:Math.min(6,n*2+1),ex:[]});kaydet(["main"]);ciz(true);return}
  if(a==="gsil"){silBekle(b.dataset.gun,"gun",null,6000);ciz(true);return}
  if(a==="kayitDegis"){V.kayit=!V.kayit;ciz();return}
  if(a==="giris"){const tel=telNorm($("gt").value),sf=$("gs").value,gh=$("gh");V.tel=$("gt").value;
    if(!tel){gh.textContent="Numarayı 0532 123 45 67 biçiminde yaz.";return}

    return}
  if(a==="yerel"){V.yerel=true;ciz();return}
