}

  --accent:#0f8a5f; --accent-2:#0b3b2c; --accent-soft:#163a2b; --track:#2a3530; --shadow:none;
  --bacak:#f6a56b; --bacak-s:#3d2416; --itis:#6aaee8; --itis-s:#142a40; --cekis:#5eead4; --cekis-s:#113531; --karin:#f0a050; --karin-s:#3a2a14;
  --mor:#a78bfa; --mor-s:#271f45; --kirmizi:#f07b76; --kirmizi-s:#3d1a1a; color-scheme:dark}}
:root[data-theme="dark"]{

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f)}

button,input,select{font:inherit;color:inherit}

.ust{display:flex;align-items:center;gap:12px;padding:4px 0 2px}
.logo{width:44px;height:44px;border-radius:14px;flex:none;display:block}
.ust h1{margin:0;font-size:21px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.ust p{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.ikb{margin-left:auto;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);flex:none}

.geri{border:0;background:none;color:var(--accent);font-weight:800;font-size:15px;padding:6px 0;cursor:pointer;align-self:flex-start}

.baslik p{margin:2px 0 0;color:var(--muted);font-weight:600;font-size:14px}

/* özet kartı */
.bakiye{background:var(--accent);color:var(--on);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}

.sync{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}

.bk-sayi{display:flex;align-items:baseline;gap:8px}
.bk-sayi b{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

.bk-bar{height:10px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}

.kirilim{display:flex;gap:8px;flex-wrap:wrap}

.kirilim small{font-size:13px;font-weight:700;color:var(--on-soft)}
.kirilim b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.devam{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border:0;border-radius:18px;padding:12px;text-align:left;cursor:pointer;color:#fff;width:100%}
.devam:active{transform:scale(.99)}
.dv-y{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dv-y small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;font-weight:700}

/* kutular */
.kutular{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.kutu .ik{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;overflow:hidden;flex:none}

.kutu .ik img{width:100%;height:100%;object-fit:cover}

.etk{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:800;white-space:nowrap}
.etk.ok{background:var(--accent-soft);color:var(--accent)}
.etk.now{background:var(--mor-s);color:var(--mor)}
.etk.bos{background:var(--soft);color:var(--muted)}
.etk.pr{background:var(--kirmizi-s);color:var(--kirmizi)}

.foto{position:relative;aspect-ratio:3/2;max-height:220px;width:100%;background:var(--soft);cursor:pointer;overflow:hidden}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto img.b{animation:cevir 2.6s infinite}

.foto.dur img.b{animation-play-state:paused}

 ]},body:[],activeSid:null,sessions:{}}}
function duzenle(x){
  x=x||{}; x.plan=x.plan||{}; x.plan.days=arr(x.plan.days).map(d=>({...d,ex:arr(d.ex).filter(e=>LIB[e.k])}));
  x.body=arr(x.body); x.sessions=x.sessions||{}; x.activeSid=x.activeSid||null;

function baglan(){
  kok=firebase.database().ref("fitness/"+kul.uid); let ilk=true;
  kok.on("value",snap=>{
    const d=snap.val(); esit=true;
    if(ilk&&!d){ilk=false; kaydet(["main",...Object.keys(S.sessions).map(s=>"s/"+s)]); ciz(); return}
    ilk=false; if(!d){ciz();return}
    const uzak=duzenle({plan:d.main&&d.main.plan,body:d.main&&d.main.body,activeSid:d.main&&d.main.activeSid,sessions:d.s||{}});
    let degisti=false;
    if(!kirli.has("main")&&d.main){const a=JSON.stringify([S.plan,S.body,S.activeSid]),b=JSON.stringify([uzak.plan,uzak.body,uzak.activeSid]); if(a!==b){S.plan=uzak.plan;S.body=uzak.body;S.activeSid=uzak.activeSid;degisti=true}}
    Object.keys(uzak.sessions).forEach(sid=>{if(kirli.has("s/"+sid)||silinecek.has("s/"+sid))return; if(JSON.stringify(S.sessions[sid])!==JSON.stringify(uzak.sessions[sid])){S.sessions[sid]=uzak.sessions[sid];degisti=true}});
    Object.keys(S.sessions).forEach(sid=>{if(!uzak.sessions[sid]&&!kirli.has("s/"+sid)){kirli.add("s/"+sid)}});
    if(kirli.size) yazmaPlanla();
    if(degisti){yerelKaydet(); if(odakta())bekleyenCiz=true; else ciz(true)} else syncGuncelle();
  },()=>{esit=false;syncGuncelle()});
}

async function yazdir(){
  if(!kok||yaziyor)return; yaziyor=true;
  try{
    for(const k of [...silinecek]){await kok.child(k).remove();silinecek.delete(k);kirli.delete(k)}

    esit=true;

}

const gunBul=id=>S.plan.days.find(d=>d.id===id);

function seansAc(dayId){let s=gunSeansi(dayId);if(s)return s;const d=gunBul(dayId);
  s={sid:uid(),dayId,dayName:d.name,date:bugun(),t:Date.now(),done:false,sets:{},keys:{}};S.sessions[s.sid]=s;S.activeSid=s.sid;return s}
function setler(s,e){const bos=()=>Array.from({length:e.sets},()=>({kg:"",r:"",ok:false}));if(!s)return bos();
  if(!s.sets[e.id])s.sets[e.id]=bos(); s.keys[e.id]=e.k; return s.sets[e.id]}
function oncekiSet(k,haric){
  for(const s of seanslar()){if(s.sid===haric)continue;
    for(const [eid,kk] of Object.entries(s.keys||{})){if(kk!==k)continue;const a=(s.sets[eid]||[]).filter(x=>x.ok);if(a.length)return {s,a}}}
  return null}
const ustTekrar=r=>{const m=String(r).match(/(\d+)\s*$/);return m?+m[1]:0};
function artirOnerisi(e,son){
  if(!son)return null;const ust=ustTekrar(e.reps);if(!ust)return null;
  if(!(son.a.length>=e.sets&&son.a.every(x=>sayi(x.r)>=ust)))return null;
  const kg=Math.max(...son.a.map(x=>sayi(x.kg)));
  if(!kg)return `Geçen sefer tüm setlerde ${ust}: bu sefer tekrarı artır`;
  const art=LIB[e.k].bar?2.5:(kg>=20?2:1);
  return `Geçen sefer tüm setlerde ${ust} tekrar: bu sefer ${yaz(kg+art)} kg dene`;
}
const e1rm=x=>{const kg=sayi(x.kg),r=sayi(x.r);return kg>0&&r>0?kg*(1+r/30):0};
const hacim=s=>{let v=0;Object.values(s.sets).forEach(a=>a.forEach(x=>{if(x.ok)v+=sayi(x.kg)*sayi(x.r)}));return v};
const biten=s=>{let n=0;Object.values(s.sets).forEach(a=>a.forEach(x=>{if(x.ok)n++}));return n};
const toplamSet=d=>d.ex.reduce((a,e)=>a+e.sets,0);

  let yan=(kg-20)/2;const ps=[];for(const p of [25,20,15,10,5,2.5,1.25]){while(yan>=p-1e-9){ps.push(p);yan-=p}}

}

  return `<div class="stack"><button class="geri" data-act="git" data-v="ana">‹ Ana sayfa</button>
   <div class="baslik"><h2>Hareketler</h2><p>Fotoğraf başlangıç ve bitiş pozisyonunu sırayla gösterir</p></div>
   <input class="alan" id="q" type="search" placeholder="Hareket ara: row" value="${esc(V.q)}" autocomplete="off">
   <div class="cipler">${[["","Tümü"],...Object.entries(GRP).map(([k,g])=>[k,g.ad.split(" ·")[0]])].map(([k,a])=>`<button class="cip ${V.grp===k?"on":""}" data-act="grp" data-g="${k}">${a}</button>`).join("")}</div>
   <div id="libliste" class="stack">${libListe(list,gunde)}</div></div>`;
}
function libListe(list,gunde){
  if(!list.length)return `<div class="kart bosx">Bu adda hareket yok.</div>`;
  return list.map(([k])=>{const g=gunde(k);return `<article class="hk">${fotoHTML(k)}${basHTML(k)}
   <div class="hk-ic" style="padding-top:12px"><div class="satir" style="justify-content:space-between">
    <a class="vid" href="${vidUrl(k)}" target="_blank" rel="noopener">${SVG.video}Videoyu izle</a>
    ${g.length?`<span class="etk ok">${esc(g.join(", "))}</span>`:""}</div>
    <div class="satir"><select class="alan" id="ekg-${k}" style="flex:1" aria-label="Eklenecek gün">${S.plan.days.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join("")}</select><button class="btn kc" data-act="libekle" data-k="${k}">Programa ekle</button></div>
   </div></article>`}).join("");
}
function cizgi(pts,band){
  if(pts.length<2)return `<div class="bosx">${pts.length?"Grafik için bir kayıt daha gerekli.":"Henüz kayıt yok."}</div>`;
  const W=340,H=170,L=40,R=14,T=12,B=26;let ys=pts.map(p=>p.y);if(band)ys=ys.concat(band);
  let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<2){lo-=1;hi+=1}const pd=(hi-lo)*.12;lo-=pd;hi+=pd;
  const X=i=>L+(W-L-R)*(i/(pts.length-1)),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const tk=[lo+(hi-lo)*.15,(lo+hi)/2,hi-(hi-lo)*.15];
  const yol=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");const sp=pts[pts.length-1];
  return `<svg class="grafik" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik">
   ${band?`<rect x="${L}" y="${Y(band[1])}" width="${W-L-R}" height="${Y(band[0])-Y(band[1])}" fill="var(--accent)" fill-opacity=".12" rx="4"/>`:""}
   ${tk.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${yaz(t)}</text>`).join("")}
   <path d="${yol} L${X(pts.length-1)} ${H-B} L${L} ${H-B} Z" fill="var(--accent)" fill-opacity=".08"/>
   <path d="${yol}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${X(pts.length-1)}" cy="${Y(sp.y)}" r="5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
   <text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">${tarih(pts[0].d)}</text><text x="${W-R}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">${tarih(sp.d)}</text></svg>`;
}
function sIlerleme(){
  const bw=S.body.slice().sort((x,y)=>x.d.localeCompare(y.d)),ilk=bw[0];
  const ks=[...new Set([...S.plan.days.flatMap(d=>d.ex.map(e=>e.k)),...Object.values(S.sessions).flatMap(s=>Object.values(s.keys||{}))])].filter(k=>LIB[k]);
  if(!ks.includes(V.pk))V.pk=ks[0];
  const pts=[];seanslar().slice().reverse().forEach(s=>{let b=0;Object.entries(s.keys||{}).forEach(([eid,k])=>{if(k===V.pk)(s.sets[eid]||[]).forEach(x=>{if(x.ok)b=Math.max(b,e1rm(x))})});if(b)pts.push({d:s.date,y:Math.round(b*10)/10})});
  const rek=new Set();{const en={};seanslar().slice().reverse().filter(s=>s.done).forEach(s=>{let r=false;Object.entries(s.keys||{}).forEach(([eid,k])=>(s.sets[eid]||[]).forEach(x=>{const v=x.ok?e1rm(x):0;if(v){if(en[k]&&v>en[k]+.01)r=true;en[k]=Math.max(en[k]||0,v)}}));if(r)rek.add(s.sid)})}
  const gec=seanslar().filter(s=>s.done).slice(0,12);
  return `<div class="stack"><button class="geri" data-act="git" data-v="ana">‹ Ana sayfa</button>
   <div class="baslik"><h2>İlerleme</h2><p>Kilo koruma bandı ve güç gelişimi</p></div>
   <section class="kart stack" style="gap:10px"><div class="satir" style="justify-content:space-between;align-items:flex-start"><div><h3>Vücut ağırlığı</h3><div class="meta">${ilk?`Hedef ${yaz(ilk.kg)} kg ± 1 (yeşil bant)`:"İlk kaydın koruma hedefin olur"}</div></div>
     ${bw.length?`<div style="text-align:right"><b style="font-size:26px;font-weight:800">${yaz(bw[bw.length-1].kg)}</b><div class="meta">${tarih(bw[bw.length-1].d)}</div></div>`:""}</div>
    ${cizgi(bw.map(b=>({d:b.d,y:b.kg})),ilk?[ilk.kg-1,ilk.kg+1]:null)}
    <div class="satir"><input class="alan" id="kiloGir" inputmode="decimal" placeholder="Bugünkü kilo, ör. 78,4" style="flex:1"><button class="btn ana" data-act="kilo">Kaydet</button></div></section>
   <section class="kart stack" style="gap:10px"><h3>Güç gelişimi</h3>
    <select class="alan" id="pkSec" aria-label="Hareket seç">${ks.map(k=>`<option value="${k}" ${k===V.pk?"selected":""}>${esc(LIB[k].n)}</option>`).join("")}</select>
    <div class="meta">Tahmini 1 tekrar maksimum (kg), her antrenmanın en iyi seti</div>${cizgi(pts)}</section>
   <section class="kart"><h3>Son antrenmanlar</h3>
    ${gec.length?gec.map(s=>`<div class="gecmis"><span><b>${esc(s.dayName)}</b> <span class="meta">${tarih(s.date)}</span> ${rek.has(s.sid)?`<span class="etk pr">Rekor</span>`:""}</span><span class="s">${biten(s)} set · ${Math.round(hacim(s)).toLocaleString("tr-TR")} kg</span></div>`).join(""):`<div class="bosx">Bitirdiğin antrenmanlar burada listelenir.</div>`}</section>
  </div>`;
}
function sProgram(){
  const sec=k=>Object.entries(GRP).map(([g,G])=>`<optgroup label="${G.ad.split(" ·")[0]}">${Object.entries(LIB).filter(([,L])=>L.g===g).map(([kk,L])=>`<option value="${kk}" ${kk===k?"selected":""}>${esc(L.n)}</option>`).join("")}</optgroup>`).join("");
  return `<div class="stack"><button class="geri" data-act="git" data-v="ana">‹ Ana sayfa</button>
   <div class="baslik"><h2>Program</h2><p>Haftada 2 gün tüm vücut: her kas grubu haftada iki kez çalışır</p></div>
   <div class="kart not">Bir harekette tüm setlerde tekrar aralığının üstüne ulaşınca uygulama bir sonraki sefer kilo artırmanı söyler.</div>
   ${S.plan.days.map(d=>`<section class="kart stack" style="gap:10px">
    <div class="satir"><label class="lb">Gün adı<input class="alan" id="gn-${d.id}" data-pf="name" data-gun="${d.id}" value="${esc(d.name)}"></label>
     <label class="lb">Gün<select class="alan" id="gw-${d.id}" data-pf="wd" data-gun="${d.id}">${WD.map((w,i)=>`<option value="${i}" ${d.wd===i?"selected":""}>${w}</option>`).join("")}</select></label></div>
    <div class="duz meta" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em"><span>Hareket</span><span>Set</span><span>Tekrar</span><span></span></div>
    ${d.ex.map(e=>`<div class="duz"><select class="alan" id="ek-${e.id}" data-ef="k" data-gun="${d.id}" data-ex="${e.id}" aria-label="Hareket">${sec(e.k)}</select>
     <input class="alan" id="es-${e.id}" inputmode="numeric" data-ef="sets" data-gun="${d.id}" data-ex="${e.id}" value="${e.sets}" aria-label="Set">
     <input class="alan" id="er-${e.id}" data-ef="reps" data-gun="${d.id}" data-ex="${e.id}" value="${esc(e.reps)}" aria-label="Tekrar">
     <button class="sil" data-act="hsil" data-gun="${d.id}" data-ex="${e.id}" aria-label="Sil">×</button></div>`).join("")}
    <div class="satir" style="justify-content:space-between"><button class="btn kc" data-act="hekle" data-gun="${d.id}">+ Hareket</button><button class="btn kc kir" data-act="gsil" data-gun="${d.id}">Günü sil</button></div>
   </section>`).join("")}
   <button class="btn" data-act="gekle">+ Gün ekle</button></div>`;
}
function sAyar(){
  return `<div class="stack"><button class="geri" data-act="git" data-v="ana">‹ Ana sayfa</button>
   <div class="baslik"><h2>Ayarlar</h2></div>
   <section class="kart stack" style="gap:8px"><h3>Hesap</h3>
    ${kul?`<div class="meta">Giriş: <b style="color:var(--ink)">${esc(kul.email)}</b></div><div class="meta">Kayıtlar YDUS'taki hesabınla eşitlenir; telefon ve webde aynı kaldığın yer.</div><button class="btn kir" data-act="cikis">Çıkış yap</button>`
     :fbDurum==="hazir"?`<div class="meta">Şu an yalnız bu cihaza kaydediliyor.</div><button class="btn ana" data-act="girisAc">Giriş yap</button>`
     :`<div class="meta">Eşitleme bu ortamda açılamadı; kayıtlar bu cihazda duruyor.</div>`}</section>
   <section class="kart"><h3>Fotoğraflar</h3><div class="meta">Hareket fotoğrafları kamu malı olarak paylaşılan free-exercise-db arşivinden alındı. Video düğmesi YouTube'da o hareketin doğru yapılışını açar.</div></section>
  </div>`;
}
function sGiris(){
  return `<div class="giris"><img class="logo" src="icon-192.png" alt="" style="width:64px;height:64px;border-radius:18px">
   <div class="baslik"><h2>Fitness</h2><p>YDUS Dahiliye'deki e-posta ve şifrenle gir</p></div>
   <input class="alan" id="ge" type="email" autocomplete="username" placeholder="ad@gmail.com" value="${esc(V.ep||"")}">
   <input class="alan" id="gs" type="password" autocomplete="current-password" placeholder="Şifre">
   <div class="hata" id="gh"></div>
   <button class="btn ana" data-act="giris">Giriş yap</button>
   <button class="btn" data-act="sifre">Şifremi unuttum</button>
   <button class="geri" data-act="yerel" style="align-self:center">Giriş yapmadan bu cihazda kullan</button></div>`;
}

/* ---------- çizim ve kaldığın yer ---------- */
function ciz(yerinde){
  const y=window.scrollY;
  const girisGerek=fbDurum==="hazir"&&!kul&&!V.yerel;
  $("app").innerHTML=girisGerek?sGiris():V.v==="gun"?sGun():V.v==="lib"?sLib():V.v==="ilerleme"?sIlerleme():V.v==="program"?sProgram():V.v==="ayar"?sAyar():sAna();
  if(yerinde)window.scrollTo(0,y);
  gorunumKaydet();
}
function gorunumKaydet(){V.y=window.scrollY;try{localStorage.setItem(LSV,JSON.stringify(V))}catch(e){}}
let kT;window.addEventListener("scroll",()=>{clearTimeout(kT);kT=setTimeout(gorunumKaydet,200)},{passive:true});
function git(v,ek){Object.assign(V,{v},ek||{});ciz();window.scrollTo(0,0)}
function tost(t){const el=$("tost");el.textContent=t;el.hidden=false;clearTimeout(tost.t);tost.t=setTimeout(()=>el.hidden=true,2800)}

/* ---------- dinlenme sayacı ---------- */
let D=null,DI=null;
function dinlenBasla(sn){D={son:Date.now()+sn*1000,top:sn};dinlenCiz();clearInterval(DI);DI=setInterval(dinlenCiz,250)}
function dinlenCiz(){const el=$("dinlen");if(!D){el.hidden=true;clearInterval(DI);return}
  const k=Math.max(0,Math.ceil((D.son-Date.now())/1000));
  if(k<=0){D=null;el.hidden=true;clearInterval(DI);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}tost("Dinlenme bitti, sıradaki set");return}
  el.hidden=false;el.innerHTML=`<span class="t">${Math.floor(k/60)}:${pad(k%60)}</span><span class="rb"><i style="width:${(k/D.top*100).toFixed(1)}%"></i></span><button data-act="d15">+15</button><button data-act="dgec">Geç</button>`}

/* ---------- olaylar ---------- */
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="git")return git(b.dataset.v);
  if(a==="ac")return git("gun",{gun:b.dataset.id});
  if(a==="foto"){b.querySelector(".b")&&b.classList.toggle("dur");return}
  if(a==="d15"){if(D){D.son+=15000;D.top+=15;dinlenCiz()}return}
  if(a==="dgec"){D=null;dinlenCiz();return}
  if(a==="grp"){V.grp=b.dataset.g;ciz(true);return}
  if(a==="tik"||a==="setekle"||a==="setsil"){
    const d=gunBul(V.gun),e=d.ex.find(x=>x.id===b.dataset.ex);if(!e)return;const s=seansAc(d.id),ar=setler(s,e);
    if(a==="setekle")ar.push({kg:"",r:"",ok:false});
    else if(a==="setsil"){if(ar.length>1)ar.pop()}
    else{const i=+b.dataset.i,x=ar[i];
      if(!x.ok){const ki=$(`kg-${e.id}-${i}`),ri=$(`r-${e.id}-${i}`);if(x.kg==="")x.kg=ki.placeholder;if(x.r==="")x.r=ri.placeholder;
        if(x.r===""){ri.focus();tost("Önce tekrar sayısını gir");return}
        x.ok=true;const hepsi=d.ex.every(q=>(s.sets[q.id]||[]).length&&s.sets[q.id].every(z=>z.ok));
        if(hepsi){D=null;dinlenCiz();tost("Tüm setler bitti, antrenmanı bitir")}else dinlenBasla(e.rest)}
      else x.ok=false}
    kaydet(["main","s/"+s.sid]);ciz(true);return}
  if(a==="bitir"){const s=gunSeansi(V.gun);if(!s)return;if(!biten(s)){tost("Önce en az bir set işaretle");return}
    s.done=true;s.end=Date.now();S.activeSid=null;D=null;dinlenCiz();kaydet(["main","s/"+s.sid]);
    tost(`Bitti: ${biten(s)} set · ${Math.round(hacim(s)).toLocaleString("tr-TR")} kg`);git("ana");return}
  if(a==="iptal"){if(b.dataset.on!=="1"){b.dataset.on="1";b.textContent="Emin misin? Tekrar dokun";return}
    const s=gunSeansi(V.gun);if(s){delete S.sessions[s.sid];S.activeSid=null;silinecek.add("s/"+s.sid);kaydet(["main"])}D=null;dinlenCiz();git("ana");return}
  if(a==="kilo"){const v=sayi($("kiloGir").value);if(v<25||v>300){tost("Geçerli bir kilo gir, ör. 78,4");return}
    const t=bugun();S.body=S.body.filter(x=>x.d!==t);S.body.push({d:t,kg:Math.round(v*10)/10});kaydet(["main"]);ciz(true);tost("Kaydedildi");return}
  if(a==="libekle"){const g=gunBul($("ekg-"+b.dataset.k).value);if(!g)return;g.ex.push(h(b.dataset.k,3,"8-12",90));kaydet(["main"]);tost(`${LIB[b.dataset.k].n}, ${g.name} gününe eklendi`);ciz(true);return}
  if(a==="hekle"){const g=gunBul(b.dataset.gun);g.ex.push(h("goblet",3,"8-12",90));kaydet(["main"]);ciz(true);return}
  if(a==="hsil"){const g=gunBul(b.dataset.gun);g.ex=g.ex.filter(e=>e.id!==b.dataset.ex);kaydet(["main"]);ciz(true);return}
  if(a==="gekle"){const n=S.plan.days.length;S.plan.days.push({id:uid(),name:"Gün "+String.fromCharCode(65+n),wd:Math.min(6,n*2+1),ex:[]});kaydet(["main"]);ciz(true);return}
  if(a==="gsil"){if(b.dataset.on!=="1"){b.dataset.on="1";b.textContent="Emin misin? Tekrar dokun";return}
    S.plan.days=S.plan.days.filter(d=>d.id!==b.dataset.gun);kaydet(["main"]);ciz(true);return}
  if(a==="giris"||a==="sifre"){const ep=$("ge").value.trim(),sf=$("gs").value;V.ep=ep;const gh=$("gh");
    if(!ep){gh.textContent="E-posta adresini yaz.";return}
    try{if(a==="sifre"){await firebase.auth().sendPasswordResetEmail(ep);gh.textContent="Şifre yenileme bağlantısı e-postana gönderildi."}
      else{if(!sf){gh.textContent="Şifreni yaz.";return}gh.textContent="Giriş yapılıyor…";await firebase.auth().signInWithEmailAndPassword(ep,sf)}}
    catch(e){gh.textContent=/wrong-password|invalid-credential|user-not-found|invalid-login/.test(e.code||"")?"E-posta ya da şifre hatalı.":/too-many/.test(e.code||"")?"Çok deneme yapıldı, biraz sonra tekrar dene.":"Giriş olmadı: "+(e.code||"bağlantı yok")}
    return}
  if(a==="yerel"){V.yerel=true;ciz();return}
  if(a==="girisAc"){V.yerel=false;ciz();return}
  if(a==="cikis"){await firebase.auth().signOut();V.yerel=false;ciz();return}
});
document.addEventListener("input",ev=>{const t=ev.target;
  if(t.id==="q"){V.q=t.value;const q=t.value.toLocaleLowerCase("tr");const list=Object.entries(LIB).filter(([k,L])=>(!V.grp||L.g===V.grp)&&(!q||L.n.toLocaleLowerCase("tr").includes(q)||L.en.includes(q)));
    $("libliste").innerHTML=libListe(list,k=>S.plan.days.filter(d=>d.ex.some(e=>e.k===k)).map(d=>d.name));return}
  if(t.dataset.f){const d=gunBul(V.gun),e=d.ex.find(x=>x.id===t.dataset.ex),s=seansAc(d.id),ar=setler(s,e);
    ar[+t.dataset.i][t.dataset.f]=t.value.replace(",",".");kaydet(["main","s/"+s.sid]);
    if(LIB[e.k].bar&&t.dataset.f==="kg"){const pl=$("pl-"+e.id);if(pl)pl.innerHTML=plakaHTML(sayi(t.value))}}
});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.id==="pkSec"){V.pk=t.value;ciz(true);return}
  if(t.dataset.pf){const d=gunBul(t.dataset.gun);d[t.dataset.pf]=t.dataset.pf==="wd"?+t.value:t.value;kaydet(["main"]);return}
  if(t.dataset.ef){const d=gunBul(t.dataset.gun),e=d.ex.find(x=>x.id===t.dataset.ex);let v=t.value;
    if(t.dataset.ef==="sets"){v=Math.max(1,Math.min(10,parseInt(v)||e.sets));t.value=v}
    e[t.dataset.ef]=v;kaydet(["main"])}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&(ev.target.id==="gs"||ev.target.id==="ge")){const b=document.querySelector('[data-act="giris"]');b&&b.click()}});

ciz();requestAnimationFrame(()=>window.scrollTo(0,V.y||0));
fbBaslat();
</script>
</body></html>
